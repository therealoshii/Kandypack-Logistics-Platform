
# Server Configuration
server.port=8080

# Session Configuration
# Session idle timeout: 15 minutes
server.servlet.session.timeout=15m

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kandypack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Settings
# Preserve the existing database schema; Hibernate must not validate or modify it at startup.
spring.jpa.hibernate.ddl-auto=none

# Preserve database table and column names as defined in the existing schema.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.kandypack.logistics=INFO
logging.level.org.springframework.security=INFO
