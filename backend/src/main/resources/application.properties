# Server Configuration
server.port=8080

# SRS 5.3: Session idle timeout set to 15 minutes (default was 30m)
server.servlet.session.timeout=15m

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kandypack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}

# Security Fix: Removed hardcoded password default ('Pixelrick@2004') to prevent committing credentials to git
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.kandypack.logistics=INFO
logging.level.org.springframework.security=INFO